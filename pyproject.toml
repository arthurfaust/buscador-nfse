[project]
name = "buscador-nfse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arthurfaust", email = "arthur.f.locatelli@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
]

[project.scripts]
buscador-nfse = "buscador_nfse:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]